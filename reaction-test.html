
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Speed Test | PLAYZO</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px 16px;
}

header {
  width: 100%;
  max-width: 650px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 55px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  color: #65e6c2;
}

.home {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

h1 {
  text-align: center;
  font-size: 30px;
  margin: 0 0 12px;
}

.subtitle {
  color: #aab6c8;
  text-align: center;
  margin-bottom: 35px;
  line-height: 1.5;
}

.stats {
  display: flex;
  gap: 14px;
  margin-bottom: 22px;
  width: 100%;
  max-width: 520px;
}

.stat {
  flex: 1;
  text-align: center;
  background: #202d40;
  padding: 15px 8px;
  border-radius: 12px;
}

.stat small {
  display: block;
  color: #aab6c8;
  margin-bottom: 7px;
}

.stat strong {
  font-size: 23px;
  color: #65e6c2;
}

#game {
  width: 100%;
  max-width: 520px;
  min-height: 300px;
  border: none;
  border-radius: 22px;
  background: #f5a623;
  color: #172033;
  font-size: 28px;
  font-weight: 900;
  cursor: pointer;
  padding: 25px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  text-align: center;
  transition: background 0.15s;
  touch-action: manipulation;
}

#game span {
  font-size: 16px;
  font-weight: 600;
}

#game.waiting {
  background: #e94b58;
  color: white;
}

#game.go {
  background: #25c78a;
  color: #092e22;
}

#game.result {
  background: #65b9f5;
  color: #102b43;
}

.instructions {
  max-width: 520px;
  color: #aab6c8;
  text-align: center;
  line-height: 1.7;
  margin-top: 25px;
  font-size: 14px;
}

footer {
  margin-top: 45px;
  color: #78869a;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 PLAYZO</div>
  <a class="home" href="./index.html">← Home</a>
</header>

<h1>REACTION SPEED TEST</h1>
<p class="subtitle">Test how fast your reflexes really are!</p>

<div class="stats">
  <div class="stat">
    <small>YOUR TIME</small>
    <strong id="time">--</strong>
  </div>
  <div class="stat">
    <small>PERSONAL BEST</small>
    <strong id="best">--</strong>
  </div>
</div>

<button id="game" type="button">
  TAP TO START
  <span>Wait for the green screen before tapping!</span>
</button>

<p class="instructions">
  How to play:<br>
  1. Tap the orange area to begin.<br>
  2. Wait until the area turns green.<br>
  3. Tap as quickly as possible.<br>
  4. Don't tap early!
</p>

<footer>© 2026 PLAYZO · Play More. Have Fun.</footer>

<script>
const game = document.getElementById("game");
const timeDisplay = document.getElementById("time");
const bestDisplay = document.getElementById("best");

let phase = "idle";
let startTime = 0;
let timer = null;
let best = null;

try {
  best = Number(localStorage.getItem("playzoReactionBest"));
  if (!Number.isFinite(best) || best <= 0) best = null;
} catch (error) {
  best = null;
}

if (best !== null) {
  bestDisplay.textContent = best + " ms";
}

function showButton(title, message, className) {
  game.className = className || "";
  game.innerHTML = title + "<span>" + message + "</span>";
}

function startGame() {
  clearTimeout(timer);
  phase = "waiting";
  timeDisplay.textContent = "--";

  showButton(
    "WAIT FOR GREEN...",
    "Don't tap yet! Tap too early and you lose.",
    "waiting"
  );

  const delay = Math.floor(Math.random() * 2500) + 1500;

  timer = setTimeout(function() {
    phase = "go";
    startTime = performance.now();

    showButton(
      "TAP NOW!",
      "Quick! Tap the green area!",
      "go"
    );
  }, delay);
}

function handleTap() {
  if (phase === "idle" || phase === "early" || phase === "result") {
    startGame();
    return;
  }

  if (phase === "waiting") {
    clearTimeout(timer);
    phase = "early";

    showButton(
      "TOO EARLY!",
      "Wait for green next time. Tap to try again.",
      ""
    );
    return;
  }

  if (phase === "go") {
    const reaction = Math.round(performance.now() - startTime);

    phase = "result";
    timeDisplay.textContent = reaction + " ms";

    if (best === null || reaction < best) {
      best = reaction;
      bestDisplay.textContent = best + " ms";

      try {
        localStorage.setItem("playzoReactionBest", best);
      } catch (error) {
        // Game still works if browser storage is unavailable.
      }

      showButton(
        reaction + " ms",
        "New personal best! Tap to play again.",
        "result"
      );
    } else {
      showButton(
        reaction + " ms",
        "Your reaction time! Tap to try again.",
        "result"
      );
    }
  }
}

game.addEventListener("click", handleTap);
</script>

</body>
</html>
